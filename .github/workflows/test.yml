name: Test

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download M&S FY2026 regression fixture
        run: |
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 180 \
            "https://corporate.marksandspencer.com/sites/marksandspencer/files/marksandspencer/annual-report/m-and-s-annual-report-and-financial-statements-2026.pdf" \
            --output "$RUNNER_TEMP/ms-fy2026-annual-report.pdf"
          test "$(head -c 5 "$RUNNER_TEMP/ms-fy2026-annual-report.pdf")" = "%PDF-"
          test "$(wc -c < "$RUNNER_TEMP/ms-fy2026-annual-report.pdf")" -gt 100000
      - name: Run tests
        env:
          SNIP_MS_PDF_PATH: ${{ runner.temp }}/ms-fy2026-annual-report.pdf
          SNIP_MS_EXPECTED_ANSWER: "£997.2m"
          SNIP_MS_EXPECTED_PERIOD: "28 March 2026"
          SNIP_MS_EXPECTED_PAGE: "116"
        run: npm test
      - name: Validate isolated Preview extension build
        run: |
          node --check scripts/build-preview-extension.mjs
          node scripts/build-preview-extension.mjs
          test -f dist-preview/manifest.json
          test -f dist-preview/background.js
          test -f dist-preview/pdf.js
          test -f dist-preview/snip-config.js
          ! grep -q "snip-ai-iota.vercel.app" dist-preview/background.js
          ! grep -q "snip-ai-iota.vercel.app" dist-preview/pdf.js
          ! grep -q "snip-ai-iota.vercel.app" dist-preview/manifest.json
          ! grep -q "zgmctojqfzwvqilwjujp.supabase.co" dist-preview/manifest.json
          grep -q "snip-ai-git-feature-multilingual-passage-segm-0af0f2-snipdeploy.vercel.app" dist-preview/snip-config.js
          grep -q "xukvqizvofbafzxplnoh.supabase.co" dist-preview/snip-config.js
          grep -q "xukvqizvofbafzxplnoh.supabase.co" dist-preview/manifest.json
      - name: Safe Preview POST guard smoke tests
        env:
          PREVIEW_API_ORIGIN: https://snip-ai-git-feature-multilingual-passage-segm-0af0f2-snipdeploy.vercel.app
        run: |
          set -euo pipefail
          post_guard() {
            route="$1"
            payload="$2"
            body_file="$RUNNER_TEMP/snip-preview-guard.json"
            status=""
            for attempt in $(seq 1 12); do
              status="$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
                --output "$body_file" --write-out "%{http_code}" \
                --request POST --header "Content-Type: application/json" \
                --data "$payload" "$PREVIEW_API_ORIGIN$route" || true)"
              if [ "$status" = "400" ]; then
                grep -q "A valid usage reservation is required" "$body_file"
                return 0
              fi
              if [ "$status" != "404" ] && [ "$status" != "502" ] && [ "$status" != "503" ]; then
                cat "$body_file"
                echo "Unexpected HTTP $status from $route"
                return 1
              fi
              sleep 5
            done
            cat "$body_file"
            echo "Preview guard check did not reach the expected 400 response for $route (last status: $status)"
            return 1
          }
          post_guard "/api/find" '{"question":"preview guard probe","blocks":[{"text":"probe"}]}'
          post_guard "/api/pdf-find" '{"question":"preview guard probe","url":"https://example.com/test.pdf"}'
          post_guard "/api/summary" '{"url":"https://example.com/test.pdf"}'
