name: Test

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download M&S FY2026 regression fixture
        run: |
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 180 \
            "https://corporate.marksandspencer.com/sites/marksandspencer/files/marksandspencer/annual-report/m-and-s-annual-report-and-financial-statements-2026.pdf" \
            --output "$RUNNER_TEMP/ms-fy2026-annual-report.pdf"
          test "$(head -c 5 "$RUNNER_TEMP/ms-fy2026-annual-report.pdf")" = "%PDF-"
          test "$(wc -c < "$RUNNER_TEMP/ms-fy2026-annual-report.pdf")" -gt 100000
      - name: Run tests
        env:
          SNIP_MS_PDF_PATH: ${{ runner.temp }}/ms-fy2026-annual-report.pdf
          SNIP_MS_EXPECTED_ANSWER: "£997.2m"
          SNIP_MS_EXPECTED_PERIOD: "28 March 2026"
          SNIP_MS_EXPECTED_PAGE: "116"
        run: npm test
